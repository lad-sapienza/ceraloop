name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Provided via repository Variables (Settings → Secrets and variables → Actions → Variables)
          # Define VITE_DIRECTUS_URL and VITE_DIRECTUS_DEFAULT_ROLE there.
          VITE_DIRECTUS_URL: ${{ vars.VITE_DIRECTUS_URL }}
          VITE_DIRECTUS_DEFAULT_ROLE: ${{ vars.VITE_DIRECTUS_DEFAULT_ROLE }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
