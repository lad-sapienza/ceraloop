name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        env:
          # Minimal defaults to allow a production build without secrets
          VITE_DIRECTUS_URL: https://example.invalid/
          VITE_DIRECTUS_DEFAULT_ROLE: 00000000-0000-0000-0000-00000000
        run: |
          npm run build

      - name: Archive build
        run: |
          cd dist
          zip -r ../ceraloop-${{ github.ref_name }}.zip .

      - name: Upload build artifact (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: ceraloop-${{ github.ref_name }}
          path: ceraloop-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ceraloop-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
